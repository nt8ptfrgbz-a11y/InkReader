<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="350" viewBox="0 0 1440 350" role="img" aria-labelledby="title desc">
<title id="title">From Markdown to your next chapter</title><desc id="desc">Import a Markdown or text file, detect chapters, read the book, and restore the saved position. All steps run locally on the iPhone.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#7B897B" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="350" rx="24" fill="#F4F4EF"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"><text x="48" y="49" font-size="12" letter-spacing="3" fill="#778178">FROM FILE TO STORY</text>
<g transform="translate(48 86)"><rect width="300" height="174" rx="18" fill="#FFFFFF" stroke="#DDE2D7"/><text x="22" y="37" font-family="monospace" font-size="13" fill="#9B8B5D">01</text><text x="22" y="73" font-size="18" font-weight="600" fill="#243D32">Import your novel</text><text x="22" y="110" font-size="14" fill="#778178">.md / .markdown / .txt</text><text x="22" y="137" font-size="14" fill="#778178">Files picker or Open In</text></g>
<path d="M358 173H384" fill="none" stroke="#7B897B" stroke-width="1.5" marker-end="url(#arrow)"/>
<g transform="translate(396 86)"><rect width="300" height="174" rx="18" fill="#FFFFFF" stroke="#DDE2D7"/><text x="22" y="37" font-family="monospace" font-size="13" fill="#9B8B5D">02</text><text x="22" y="73" font-size="18" font-weight="600" fill="#243D32">Find the chapters</text><text x="22" y="110" font-size="14" fill="#778178">Chinese + English headings</text><text x="22" y="137" font-size="14" fill="#778178">Skip the generated contents</text></g>
<path d="M706 173H732" fill="none" stroke="#7B897B" stroke-width="1.5" marker-end="url(#arrow)"/>
<g transform="translate(744 86)"><rect width="300" height="174" rx="18" fill="#FFFFFF" stroke="#DDE2D7"/><text x="22" y="37" font-family="monospace" font-size="13" fill="#9B8B5D">03</text><text x="22" y="73" font-size="18" font-weight="600" fill="#243D32">Make yourself at home</text><text x="22" y="110" font-size="14" fill="#778178">Themes, type and bookmarks</text><text x="22" y="137" font-size="14" fill="#778178">Read one chapter at a time</text></g>
<path d="M1054 173H1080" fill="none" stroke="#7B897B" stroke-width="1.5" marker-end="url(#arrow)"/>
<g transform="translate(1092 86)"><rect width="300" height="174" rx="18" fill="#FFFFFF" stroke="#DDE2D7"/><text x="22" y="37" font-family="monospace" font-size="13" fill="#9B8B5D">04</text><text x="22" y="73" font-size="18" font-weight="600" fill="#243D32">Pick up where you left off</text><text x="22" y="110" font-size="14" fill="#778178">Per-book saved position</text><text x="22" y="137" font-size="14" fill="#778178">Ready when you return</text></g>
<text x="48" y="309" font-size="14" fill="#778178">All four steps run on your device. No account, backend or AI API key is required.</text></g></svg>