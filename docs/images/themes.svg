<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Three ways to settle into a story</title><desc id="desc">Illustrations of the app's warm paper, clean white, and night reading palettes, with Chinese sample text. These are layout illustrations, not device screenshots.</desc>
<rect width="1440" height="900" rx="24" fill="#F1F0EB"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#243D32"><text x="48" y="49" font-size="12" letter-spacing="3">READING THEMES · UI ILLUSTRATIONS</text><text x="48" y="91" font-size="28" font-weight="500">Three ways to settle into a story.</text></g>
<g transform="translate(48 128)">
    <rect width="432" height="680" rx="22" fill="#F6F0E5" stroke="#D4D8CD"/>
    <g fill="#343A34"><text x="30" y="38" font-family="sans-serif" font-size="11" letter-spacing="2" opacity=".65">WARM PAPER</text>
    <line x1="28" y1="58" x2="404" y2="58" stroke="#343A34" opacity=".12"/>
    <text x="30" y="93" font-family="sans-serif" font-size="12" opacity=".6">诛仙同人 · 长相守</text>
    <text x="30" y="143" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="25" font-weight="600">第01章 铃声未歇</text>
<text x="30" y="194" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">　　刀尖刚抵上旧伤，张小凡的手腕便被按</text>
<text x="30" y="230" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">住了。</text>
<text x="30" y="283" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">　　幽姬没有夺刀。她将指腹压在伤口上方</text>
<text x="30" y="319" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">，那里缠过布，皮肤比别处白，往下一点却</text>
<text x="30" y="355" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">是没有长好的血痂。张小凡看着寒玉床，手</text>
<text x="30" y="391" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">指仍握在刀柄上。</text>
<text x="30" y="444" font-family="'Songti SC','Noto Serif CJK SC',serif" font-size="19">　　“放下。”她说。</text>
<line x1="28" y1="615" x2="404" y2="615" stroke="#343A34" opacity=".12"/>
    <text x="30" y="648" font-family="sans-serif" font-size="11" opacity=".55">目录</text><text x="182" y="648" font-family="monospace" font-size="11" opacity=".45">01 / 50</text><text x="376" y="648" font-family="sans-serif" font-size="11" opacity=".55">排版</text></g>
    <text x="8" y="717" font-family="monospace" font-size="12" fill="#778178">BACKGROUND #F6F0E5 / TEXT #343A34</text></g>
